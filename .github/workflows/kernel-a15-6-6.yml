name: 内核源码拉取 - Android 15 (6.6)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:     # 手动触发时不需要任何输入，矩阵已固定
  workflow_call:         # 供其他工作流调用时也可无需输入
    inputs:
      # 如果将来需要外部动态指定版本，可保留这些，但当前矩阵固定，可省略
      android_version:
        required: false
        type: string
        default: "android15"
      kernel_version:
        required: false
        type: string
        default: "6.6"

jobs:
  publish-sources:
    name: "6.6.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "50"
            os_patch_level: "2024-10"
          - sub_level: "56"
            os_patch_level: "2024-11"
          - sub_level: "57"
            os_patch_level: "2024-12"
          - sub_level: "58"
            os_patch_level: "2025-01"
          - sub_level: "66"
            os_patch_level: "2025-02"
          - sub_level: "77"
            os_patch_level: "2025-03"
          - sub_level: "82"
            os_patch_level: "2025-04"
          - sub_level: "87"
            os_patch_level: "2025-05"
          - sub_level: "89"
            os_patch_level: "2025-06"
          - sub_level: "92"
            os_patch_level: "2025-07"
          - sub_level: "98"
            os_patch_level: "2025-09"
          - sub_level: "102"
            os_patch_level: "2025-10"
          - sub_level: "118"
            os_patch_level: "2026-01"
          - sub_level: "127"
            os_patch_level: "2026-04"
          - sub_level: "X"
            os_patch_level: "lts"
    uses: ./.github/workflows/build.yml   # 指向你修改后的拉取+发布工作流
    secrets: inherit
    with:
      android_version: "android15"
      kernel_version: "6.6"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      # 以下所有原本的 KSU/ZRAM/BBG 参数全部删除，不再需要
